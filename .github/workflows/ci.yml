name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:
  # Allow this workflow to be called by other workflows (e.g., deploy.yml)
  workflow_call:

permissions:
  contents: read

jobs:
  plugin-mcp:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        plugin: [ephemeris-server, symbolism-server]
    defaults:
      run:
        working-directory: plugins/tarot-astro-plugins/${{ matrix.plugin }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: plugins/tarot-astro-plugins/${{ matrix.plugin }}/package-lock.json

      - name: Install plugin dependencies
        run: npm ci

      - name: Test plugin calculations and MCP protocol
        run: npm test

  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run deploy script tests
        run: npm run test:deploy

      - name: Validate Cloudflare script/docs commands
        run: npm run lint:cloudflare

      - name: Validate maintained documentation links
        run: npm run docs:check

      - name: Vision QA gate
        env:
          VISION_EVAL_MANIFEST_DIR: ${{ vars.VISION_EVAL_MANIFEST_DIR }}
        run: |
          if [ -n "$VISION_EVAL_MANIFEST_DIR" ]; then
            npm run ci:vision-check
          else
            echo "Vision qualification not run: VISION_EVAL_MANIFEST_DIR is unset. Photo recognition and symbol quality remain unverified."
          fi

      - name: Narrative QA gate (primary Claude provider)
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          NARRATIVE_EVAL_BACKEND: claude-api
        run: npm run ci:narrative-check

      - name: Preserve narrative evaluation evidence
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: narrative-evaluation-${{ github.run_id }}-${{ github.run_attempt }}
          path: data/evaluations/runs/
          if-no-files-found: ignore
          retention-days: 14
