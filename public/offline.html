<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Tableu · Offline</title>
    <meta name="theme-color" content="#0F0E13" />
    <script>
      try {
        if (localStorage.getItem('tarot-theme') === 'light') {
          document.documentElement.classList.add('light');
          document.querySelector('meta[name="theme-color"]').content = '#FAFAFA';
        }
      } catch (e) {}
    </script>
    <style>
      /* Self-contained so recovery does not depend on cached CSS or fonts. */
      :root {
        color-scheme: dark;
        --bg: #0F0E13;
        --surface: #1C1A22;
        --text: #E8E6E3;
        --muted: #CCC5B9;
        --accent: #E8DAC3;
        --accent-hover: #D4B896;
        --on-accent: #1C1A22;
        --border: rgba(212, 184, 150, 0.3);
        --hover: #2A2730;
        --shadow: rgba(0, 0, 0, 0.3);
      }
      :root.light {
        color-scheme: light;
        --bg: #FAFAFA;
        --surface: #FFFFFF;
        --text: #1A1A1A;
        --muted: #555555;
        --accent: #8A6B3B;
        --accent-hover: #7D623B;
        --on-accent: #FFFFFF;
        --border: rgba(125, 98, 59, 0.3);
        --hover: #F5F5F5;
        --shadow: rgba(26, 26, 26, 0.08);
      }
      * {
        box-sizing: border-box;
      }
      ::selection {
        background: var(--accent);
        color: var(--on-accent);
      }
      body {
        font-family: "Inter Variable", "Inter", system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: var(--bg);
        color: var(--text);
        margin: 0;
        min-height: 100vh;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: max(16px, env(safe-area-inset-top)) max(16px, env(safe-area-inset-right)) max(16px, env(safe-area-inset-bottom)) max(16px, env(safe-area-inset-left));
        text-align: center;
        overflow-wrap: anywhere;
      }
      .card {
        border: 1px solid var(--border);
        border-radius: 0.875rem;
        padding: clamp(20px, 5vw, 32px);
        width: 100%;
        max-width: 30rem;
        min-width: 0;
        background: var(--surface);
        box-shadow: 0 12px 32px -8px var(--shadow);
      }
      h1 {
        font-family: "Source Serif 4 Variable", "Source Serif 4", Georgia, "Times New Roman", serif;
        margin: 0 0 0.75rem;
        font-size: 1.875rem;
        font-weight: 400;
        line-height: 1.2;
        text-wrap: balance;
      }
      p {
        margin: 0;
        font-size: 1rem;
        line-height: 1.5;
        color: var(--muted);
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        gap: 0.75rem;
        margin-top: 1.5rem;
      }
      .btn {
        flex: 1 1 9rem;
        min-height: 52px;
        min-width: 0;
        padding: 12px 16px;
        border-radius: 0.75rem;
        border: 1px solid var(--border);
        background: transparent;
        color: inherit;
        font-family: inherit;
        font-weight: 600;
        font-size: 1rem;
        line-height: 1.5;
        cursor: pointer;
        text-decoration: none;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        transition: background-color 0.15s ease;
      }
      .btn:hover {
        background: var(--hover);
      }
      .btn:focus-visible {
        outline: 2px solid var(--accent);
        outline-offset: 3px;
      }
      .btn-primary {
        background: var(--accent);
        color: var(--on-accent);
        border-color: var(--accent);
      }
      .btn-primary:hover,
      .btn-primary:active {
        background: var(--accent-hover);
        border-color: var(--accent-hover);
      }
      @media (prefers-reduced-motion: reduce) {
        .btn {
          transition: none;
        }
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Offline for now</h1>
      <p>
        Tableu can run offline once your spreads and journal load at least once.
        Please reconnect to sync the latest decks, AI insights, and audio features.
      </p>
      <div class="actions">
        <a href="/journal" class="btn btn-primary">Open Journal</a>
        <button type="button" class="btn" onclick="window.location.reload()">Retry connection</button>
      </div>
    </main>
  </body>
</html>
