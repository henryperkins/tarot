openapi: 3.1.0
info:
  title: Tarot Reading API
  description: >
    API for generating personalized tarot readings through the deployed
    tarot backend. This schema covers synchronous direct/draw GPT Actions.
    Job start/status/SSE/cancel endpoints are a separate contract documented in
    docs/DEVELOPER_ONBOARDING.md (Reading Jobs) and docs/reading-context-inputs.md;
    these Actions do not automatically use jobs. Reading prompt versions do not
    change this API document version.
  version: "1.0.0"
servers:
  - url: https://tarot.lakefrontdev.com
    description: Production tarot backend
security:
  - bearerAuth: []
paths:
  /api/tarot-reading:
    post:
      operationId: createTarotReading
      summary: Generate a personalized tarot reading
      description: >
        Creates a tarot reading synchronously. The request must include
        spread information and an array of cards with their positions,
        names, exact Upright/Reversed orientations and nonempty meanings (required
        for direct-request compatibility). The server resolves canonical catalog
        meaning; a differing incoming meaning is separate caller interpretation. Optional user question,
        reflections, personalization, deck style, and location data may
        be included when available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTarotReadingRequest"
            examples:
              threeCardReading:
                summary: Three-card tarot reading
                value:
                  spreadInfo:
                    name: Three Card Spread
                    key: threeCard
                  cardsInfo:
                    - position: Past
                      card: The Fool
                      orientation: Upright
                      meaning: New beginnings, openness, and a willingness to take a leap.
                    - position: Present
                      card: The Magician
                      orientation: Upright
                      meaning: Focused intention, resourcefulness, and creative power.
                    - position: Future
                      card: Six of Swords
                      orientation: Reversed
                      meaning: Resistance to transition or difficulty moving on.
                  userQuestion: What should I know about my career path?
                  reflectionsText: I am considering changing jobs soon.
                  deckStyle: rws-1909
                  personalization:
                    displayName: Henry
                    readingTone: balanced
                    spiritualFrame: mixed
                    tarotExperience: intermediate
                    preferredSpreadDepth: standard
                    focusAreas:
                      - career
                      - decision-making
      responses:
        "200":
          description: Tarot reading generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarotReadingResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tarot-reading/draw:
    post:
      operationId: drawTarotReading
      summary: Draw cards and generate a personalized tarot reading
      description: >
        Draws cards on the backend and generates a reading in one call.
        Use when the user has NOT provided cards. Returns both the drawn
        cardsInfo and the narrative. If the user already has cards, use
        `createTarotReading` instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawTarotReadingRequest"
            examples:
              drawCelticCross:
                summary: Backend-drawn Celtic Cross reading
                value:
                  spreadInfo:
                    name: Celtic Cross
                    key: celtic
                  userQuestion: What should I focus on this season?
                  deckStyle: rws-1909
                  allowReversals: true
                  personalization:
                    displayName: Henry
                    readingTone: balanced
                    spiritualFrame: mixed
                    tarotExperience: intermediate
                    preferredSpreadDepth: deep
                    focusAreas:
                      - career
                      - growth
              drawThreeCard:
                summary: Backend-drawn three-card reading with seed
                value:
                  spreadInfo:
                    name: Three Card Spread
                    key: threeCard
                  userQuestion: How can I show up for my partner this week?
                  reflectionsText: We have been distant lately.
                  deckStyle: rws-1909
                  allowReversals: true
                  seed: "ritual-2026-05-23-knocks-3-cut-mid"
      responses:
        "200":
          description: Tarot reading drawn and generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawTarotReadingResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: >
        Bearer token. Either a per-user API key (`sk_...`, Pro-only) or the
        configured service token (`GPT_SERVICE_TOKEN`), which authenticates as a
        Plus-or-higher service account. Send as `Authorization: Bearer <token>`.
  schemas:
    CreateTarotReadingRequest:
      type: object
      required:
        - spreadInfo
        - cardsInfo
      additionalProperties: false
      properties:
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        cardsInfo:
          type: array
          description: Cards in the order they appear in the spread.
          minItems: 1
          maxItems: 78
          items:
            $ref: "#/components/schemas/RequestCardInfo"
        userQuestion:
          type: string
          maxLength: 2000
          description: Optional question or topic posed by the user.
        reflectionsText:
          type: string
          maxLength: 5000
          description: Optional general notes from the user.
        decisionPaths:
          $ref: "#/components/schemas/DecisionPaths"
        useSavedMemories:
          type: boolean
          default: true
          description: >
            False bypasses saved-memory candidate loading, selection and
            initial-reading access writes. Applies to this reading only;
            does not delete memories or change follow-up capture.
        reversalFrameworkOverride:
          type: string
          description: Optional override for the reversal interpretation framework.
        deckStyle:
          type: string
          description: Optional deck style identifier.
          examples:
            - rws-1909
        personalization:
          $ref: "#/components/schemas/Personalization"
        location:
          $ref: "#/components/schemas/Location"
        persistLocationToJournal:
          type: boolean
          description: Whether to persist location data with the journal entry.
        includePromptDebug:
          type: boolean
          default: false
          description: >
            Diagnostic opt-in, owner-only. When true AND the request is
            authenticated with the owner token (GPT_OWNER_TOKEN, not the shared
            GPT_SERVICE_TOKEN) AND the backend has PROMPT_DEBUG_ENABLED set, the
            response includes a `promptDebug` object with the assembled
            system/user prompt. Ignored (silently) for every other caller,
            including ordinary service-account callers.
    DrawTarotReadingRequest:
      type: object
      required:
        - spreadInfo
      additionalProperties: false
      description: >
        Request to draw cards on the backend and generate a reading.
        Mirrors `CreateTarotReadingRequest` but omits `cardsInfo` because
        the server performs the draw. Include `spreadInfo.key` whenever
        possible so the backend can resolve position metadata.
      properties:
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        userQuestion:
          type: string
          maxLength: 2000
          description: Optional question or topic posed by the user.
        reflectionsText:
          type: string
          maxLength: 5000
          description: Optional general notes from the user.
        decisionPaths:
          $ref: "#/components/schemas/DecisionPaths"
        useSavedMemories:
          type: boolean
          default: true
          description: >
            False bypasses saved-memory candidate loading, selection and
            initial-reading access writes. Applies to this reading only;
            does not delete memories or change follow-up capture.
        reversalFrameworkOverride:
          type: string
          description: Optional override for the reversal interpretation framework.
        deckStyle:
          type: string
          description: Optional deck style identifier.
          examples:
            - rws-1909
            - thoth-a1
            - marseille-classic
        allowReversals:
          type: boolean
          description: >
            Whether the backend may deal reversed cards. Defaults to true
            when omitted.
          default: true
        seed:
          type: string
          description: >
            Optional deterministic seed for the shuffle/draw. When provided,
            the backend reuses it so the same ritual inputs produce the
            same hand. Free-form string.
        personalization:
          $ref: "#/components/schemas/Personalization"
        location:
          $ref: "#/components/schemas/Location"
        persistLocationToJournal:
          type: boolean
          description: Whether to persist location data with the journal entry.
        includePromptDebug:
          type: boolean
          default: false
          description: >
            Diagnostic opt-in, owner-only. When true AND the request is
            authenticated with the owner token (GPT_OWNER_TOKEN, not the shared
            GPT_SERVICE_TOKEN) AND the backend has PROMPT_DEBUG_ENABLED set, the
            response includes a `promptDebug` object with the assembled
            system/user prompt. Ignored (silently) for every other caller,
            including ordinary service-account callers.
    DrawTarotReadingResponse:
      type: object
      required:
        - reading
        - provider
        - requestId
        - cardsInfo
      additionalProperties: true
      description: >
        Response returned by `drawTarotReading`. Extends the standard
        reading response with `cardsInfo` describing the cards the backend
        actually drew, plus an optional `seed` so the draw can be
        reproduced or journaled.
      properties:
        reading:
          type: string
          description: Generated tarot reading narrative.
        provider:
          type: string
          description: Reading backend or provider used.
          examples:
            - claude-api
            - modal-qwen
            - openai-native
            - local-composer
        requestId:
          type: string
          description: Unique request identifier.
        cardsInfo:
          type: array
          description: Cards the backend drew, in spread order.
          minItems: 1
          items:
            $ref: "#/components/schemas/CardInfo"
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        seed:
          type: string
          description: Seed actually used for the draw, when available.
        themes:
          description: Overarching themes detected in the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        reasoning:
          description: Reasoning or model metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        context:
          description: Contextual inference applied to the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        visionInsights:
          type: array
          description: Vision-derived insights, if card images were used.
          items:
            type: object
            additionalProperties: true
        narrativeMetrics:
          description: Coverage or quality metrics for the generated narrative.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        graphRAG:
          description: Graph retrieval-augmented generation metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        sourceUsage:
          anyOf:
            - $ref: "#/components/schemas/SourceUsage"
            - type: "null"
        promptDebug:
          $ref: "#/components/schemas/PromptDebug"
    SpreadInfo:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the tarot spread.
          examples:
            - Three Card Spread
            - Celtic Cross
        key:
          type: string
          description: >
            Canonical spread identifier. Always send it: name-only requests
            can fail when the display name is not in the backend alias map,
            and the key is what the journal stores and groups history by.
          enum:
            - single
            - threeCard
            - fiveCard
            - decision
            - relationship
            - celtic
    DecisionPaths:
      type: object
      additionalProperties: false
      description: >
        Optional decision-spread labels. Empty string explicitly clears a label;
        omission permits a legacy decision-position fallback. Null, nonstrings,
        oversized strings and unknown keys are rejected. Other spreads ignore
        these labels with not_applicable diagnostics. Original positions remain.
      properties:
        a:
          type: string
          maxLength: 80
        b:
          type: string
          maxLength: 80
    RequestCardInfo:
      type: object
      required:
        - position
        - card
        - orientation
        - meaning
      additionalProperties: false
      properties:
        position:
          type: string
          description: Position of the card in the spread.
          examples:
            - Past
            - Present
            - Future
        card:
          type: string
          description: Name of the tarot card.
          examples:
            - The Fool
            - The Magician
            - Six of Swords
        orientation:
          type: string
          description: Exact normalized orientation (case-sensitive).
          enum:
            - Upright
            - Reversed
        meaning:
          type: string
          minLength: 1
          maxLength: 1000
          description: >
            Required nonempty legacy direct-request field (whitespace-only is
            rejected after trimming). The server always resolves authoritative
            upright/reversed catalog meaning. A differing input is derived as
            separate untrusted callerMeaning; clients cannot submit that derived
            field as trusted input. MCP supplied-card tools separately permit
            omitted meaning; their adapter fills this direct-route requirement.
        userReflection:
          type: string
          maxLength: 2000
          description: Optional user note for this supplied card.
        number:
          type: integer
          description: Optional card number if known.
        suit:
          type: string
          description: Optional suit for minor arcana cards.
          examples:
            - Cups
            - Pentacles
            - Swords
            - Wands
        rank:
          type: string
          description: Optional rank name for minor arcana cards.
          examples:
            - Ace
            - Two
            - Queen
        rankValue:
          type: integer
          description: Optional numeric rank value for minor arcana cards.
    CardInfo:
      type: object
      required:
        - position
        - card
        - orientation
        - meaning
      additionalProperties: false
      properties:
        position:
          type: string
          description: Position of the card in the spread.
          examples:
            - Past
            - Present
            - Future
        card:
          type: string
          description: Name of the tarot card.
          examples:
            - The Fool
            - The Magician
            - Six of Swords
        orientation:
          type: string
          description: Exact normalized orientation (case-sensitive).
          enum:
            - Upright
            - Reversed
        meaning:
          type: string
          description: Server-resolved canonical upright or reversed catalog meaning.
        callerMeaning:
          type: string
          maxLength: 1000
          readOnly: true
          description: Derived differing caller interpretation; separate untrusted personal context.
        userReflection:
          type: string
          maxLength: 2000
          description: User note preserved for the card, when present.
        number:
          type: integer
          description: Optional card number if known.
        suit:
          type: string
          description: Optional suit for minor arcana cards.
          examples:
            - Cups
            - Pentacles
            - Swords
            - Wands
        rank:
          type: string
          description: Optional rank name for minor arcana cards.
          examples:
            - Ace
            - Two
            - Queen
        rankValue:
          type: integer
          description: Optional numeric rank value for minor arcana cards.
    Personalization:
      type: object
      description: Optional personalization settings for the reading narrative.
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: User's preferred name.
        readingTone:
          type: string
          description: Preferred tone of the reading.
          enum:
            - gentle
            - balanced
            - blunt
        spiritualFrame:
          type: string
          description: Preferred interpretive frame.
          enum:
            - psychological
            - spiritual
            - mixed
            - playful
        tarotExperience:
          type: string
          description: User's experience level with tarot.
          enum:
            - newbie
            - intermediate
            - experienced
        preferredSpreadDepth:
          type: string
          description: Preferred depth of the reading.
          enum:
            - short
            - standard
            - deep
        focusAreas:
          type: array
          maxItems: 12
          description: Saved interests; current inputs take precedence.
          items:
            type: string
            minLength: 1
            maxLength: 40
          examples:
            - - career
              - relationships
              - decision-making
    Location:
      type: object
      description: Optional location context.
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA timezone name.
          examples:
            - America/Chicago
        accuracy:
          type: number
          description: Optional GPS accuracy in meters.
        source:
          type: string
          description: Source of the location data.
          enum:
            - browser
            - manual
    TarotReadingResponse:
      type: object
      required:
        - reading
        - provider
        - requestId
      additionalProperties: true
      properties:
        reading:
          type: string
          description: Generated tarot reading narrative.
        provider:
          type: string
          description: Reading backend or provider used.
          examples:
            - claude-api
            - modal-qwen
            - openai-native
            - local-composer
        requestId:
          type: string
          description: Unique request identifier.
        themes:
          description: Overarching themes detected in the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        reasoning:
          description: Reasoning or model metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        context:
          description: Contextual inference applied to the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        visionInsights:
          type: array
          description: Vision-derived insights, if card images were used.
          items:
            type: object
            additionalProperties: true
        narrativeMetrics:
          description: Coverage or quality metrics for the generated narrative.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        graphRAG:
          description: Graph retrieval-augmented generation metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        sourceUsage:
          anyOf:
            - $ref: "#/components/schemas/SourceUsage"
            - type: "null"
        promptDebug:
          $ref: "#/components/schemas/PromptDebug"
    SourceUsage:
      type: object
      additionalProperties: true
      description: >
        Additive bounded diagnostics for the final accepted backend input or
        deterministic content actually rendered. Inclusion does not establish
        attention, reliance, accuracy or usefulness. Missing legacy fields stay
        unknown; selected/discovered counts do not prove final retention.
        No query/note/label text, names, memory IDs/text, embedding vectors/inputs,
        credentials, private selection, receipt or run/attempt mapping is exposed.
        A canned safety replacement has null sourceUsage. MCP uses a separate
        compact outcome schema and does not return this full object.
      properties:
        memories:
          type: object
          additionalProperties: false
          properties:
            requested:
              type: boolean
            used:
              type: boolean
            candidatesProvided:
              type: integer
              minimum: 0
              maximum: 100
            memoriesSelected:
              type: integer
              minimum: 0
              maximum: 3
            memoriesUsedInPrompt:
              type: integer
              minimum: 0
              maximum: 3
            skippedReason:
              type: [string, "null"]
              description: Fixed reason code, or null when used; never private memory text or identity.
        graphRAG:
          type: object
          additionalProperties: true
          description: >
            Bounded discovered/projected/scored/selected/retained counts,
            selected-deck identity, final selected passage indices and fixed
            scoring/fallback reasons. Summary-only material has zero full
            passages; intermediate budgetTrimmedTo is not final retention.
        userContext:
          type: object
          additionalProperties: true
          description: >
            Bounded retention by fixed source slots, including interpretation-0
            through interpretation-77 separately from canonical card meaning and
            reflections. Aggregate used includes interpretation-only retention.
        patterns:
          type: object
          additionalProperties: true
          description: Bounded provided/retained direct-highlight counts for actual backend use.
    PromptDebug:
      type: object
      additionalProperties: true
      description: >
        Diagnostic echo of the exact prompt the backend assembled for the
        narrative model. Present only when the request set
        `includePromptDebug: true`, the caller authenticated with the owner
        token (`GPT_OWNER_TOKEN`), and the backend has `PROMPT_DEBUG_ENABLED`
        set. Absent for readings served by the local composer, which uses no
        model prompt. Prompt text is unredacted, and each prompt is truncated to
        20,000 characters so the response stays under the 100,000-character
        Actions ceiling.
      properties:
        templateVersion:
          type: string
          description: Reading prompt template version (READING_PROMPT_VERSION).
        provider:
          type: string
          description: Narrative backend that assembled the prompt.
          examples:
            - claude-api
            - modal-qwen
            - openai-native
        systemPrompt:
          type: string
          description: Verbatim system prompt sent to the narrative model.
        userPrompt:
          type: string
          description: Verbatim user prompt assembled from the cards and context.
        truncated:
          type: boolean
          description: >
            True when either prompt exceeded the 20,000-character budget and was
            cut short. The elided text is marked inline.
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
          description: Error message.
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
        requestId:
          type: string
          description: Request identifier for debugging.
