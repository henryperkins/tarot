openapi: 3.1.0
info:
  title: Tarot Reading & Journal API
  description: >
    Reading generation and journal persistence for the deployed tarot backend, as a single custom GPT Action. The
    reading operations are unchanged from tarot-reading-openapi.yaml apart from corrected spread name/key examples.
    Journal operations write to whichever account the bearer token authenticates as, so this merged form is for an
    owner-only GPT; a published GPT needs the journal operations split into a second Action with per-user auth.
  version: "1.0.0"
servers:
  - url: https://tarot.lakefrontdev.com
    description: Production tarot backend
security:
  - bearerAuth: []
paths:
  /api/tarot-reading:
    post:
      operationId: createTarotReading
      summary: Generate a personalized tarot reading
      description: >
        Creates a tarot reading synchronously. The request must include
        spread information and an array of cards with their positions,
        names, orientations, and meanings. Optional user question,
        reflections, personalization, deck style, and location data may
        be included when available.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateTarotReadingRequest"
            examples:
              threeCardReading:
                summary: Three-card tarot reading
                value:
                  spreadInfo:
                    name: Three-Card Story (Past · Present · Future)
                    key: threeCard
                  cardsInfo:
                    - position: Past
                      card: The Fool
                      orientation: upright
                      meaning: New beginnings, openness, and a willingness to take a leap.
                    - position: Present
                      card: The Magician
                      orientation: upright
                      meaning: Focused intention, resourcefulness, and creative power.
                    - position: Future
                      card: Six of Swords
                      orientation: reversed
                      meaning: Resistance to transition or difficulty moving on.
                  userQuestion: What should I know about my career path?
                  reflectionsText: I am considering changing jobs soon.
                  deckStyle: rws-1909
                  personalization:
                    displayName: Henry
                    readingTone: balanced
                    spiritualFrame: mixed
                    tarotExperience: intermediate
                    preferredSpreadDepth: standard
                    focusAreas:
                      - career
                      - decision-making
      responses:
        "200":
          description: Tarot reading generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TarotReadingResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/tarot-reading/draw:
    post:
      operationId: drawTarotReading
      summary: Draw cards and generate a personalized tarot reading
      description: >
        Draws cards on the backend and generates a reading in one call.
        Use when the user has NOT provided cards. Returns both the drawn
        cardsInfo and the narrative. If the user already has cards, use
        `createTarotReading` instead.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DrawTarotReadingRequest"
            examples:
              drawCelticCross:
                summary: Backend-drawn Celtic Cross reading
                value:
                  spreadInfo:
                    name: Celtic Cross (Classic 10-Card)
                    key: celtic
                  userQuestion: What should I focus on this season?
                  deckStyle: rws-1909
                  allowReversals: true
                  personalization:
                    displayName: Henry
                    readingTone: balanced
                    spiritualFrame: mixed
                    tarotExperience: intermediate
                    preferredSpreadDepth: deep
                    focusAreas:
                      - career
                      - growth
              drawThreeCard:
                summary: Backend-drawn three-card reading with seed
                value:
                  spreadInfo:
                    name: Three-Card Story (Past · Present · Future)
                    key: threeCard
                  userQuestion: How can I show up for my partner this week?
                  reflectionsText: We have been distant lately.
                  deckStyle: rws-1909
                  allowReversals: true
                  seed: "ritual-2026-05-23-knocks-3-cut-mid"
      responses:
        "200":
          description: Tarot reading drawn and generated successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DrawTarotReadingResponse"
        "400":
          description: Invalid request body.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Unauthorized. Missing or invalid bearer token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "422":
          description: Request could not be processed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/journal:
    post:
      operationId: saveReadingToJournal
      summary: Save a completed tarot reading to the user's journal
      description: >
        Saves an already-generated reading to the journal. Call only when the user explicitly asks to save, journal,
        keep, or archive it, or says yes to an offer. Never invent or redraw cards: carry them over, renaming each
        card's `card` field to `name`. Returns entry.id — retain it for reflections.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SaveReadingRequest"
            examples:
              saveDrawnThreeCard:
                summary: Save a backend-drawn three-card reading
                value:
                  spread: Three-Card Story (Past · Present · Future)
                  spreadKey: threeCard
                  question: What should I know about my career path?
                  cards:
                    - position: Past
                      name: The Fool
                      orientation: Upright
                      number: 0
                    - position: Present
                      name: The Magician
                      orientation: Upright
                      number: 1
                    - position: Future
                      name: Six of Swords
                      orientation: Reversed
                      suit: Swords
                      rank: Six
                      rankValue: 6
                  personalReading: The arc here moves from openness, through deliberate action, into a transition you...
                  themes:
                    dominantSuit: Swords
                    majorArcanaCount: 2
                  context: career
                  provider: azure-gpt5
                  requestId: req_01J9X2K4M7QN
                  sessionSeed: ritual-2026-05-23-knocks-3-cut-mid
                  deckId: rws-1909
                  userPreferences:
                    displayName: Henry
                    readingTone: balanced
                    spiritualFrame: mixed
                    tarotExperience: intermediate
                    preferredSpreadDepth: standard
                    focusAreas:
                      - career
                      - decision-making
      responses:
        "201":
          description: Journal entry created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryResponse"
        "200":
          description: >
            An entry with this `sessionSeed` already exists; the existing entry is returned with `deduplicated: true`
            and nothing is written. Readings saved without a `sessionSeed` are never deduplicated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/JournalEntryResponse"
        "400":
          description: Invalid journal entry data. `spread`, `spreadKey` and a `cards` array are all required.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cloud journal sync requires an active Plus or Pro subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
  /api/journal/{id}/reflections:
    post:
      operationId: addReflectionToJournalEntry
      summary: Attach a user-authored reflection to a saved reading
      description: >
        Attaches a user-authored reflection to a saved entry. Call only when the user explicitly asks to save, attach,
        or note what they said, or says yes to an offer. Requires an entry.id from saveReadingToJournal in this
        conversation; never guess. For scope=card, send the card name exactly as saved.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          description: Journal entry id returned by `saveReadingToJournal`.
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddReflectionRequest"
            examples:
              cardScoped:
                summary: Reflection about a single card
                value:
                  text: The Hermit feels like the six months I spent working alone.
                  scope: card
                  card: The Hermit
                  position: Past
              readingScoped:
                summary: Reflection about the whole reading
                value:
                  text: The whole reading feels like it is asking me to stop forcing the timeline.
                  scope: reading
      responses:
        "200":
          description: Reflection attached successfully.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReflectionResponse"
        "400":
          description: >
            Missing or overlong text, invalid scope, or a card that is not in the saved reading. An ambiguous card
            (present twice, no `position` given) is also rejected here.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "401":
          description: Not authenticated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "403":
          description: Cloud journal sync requires an active Plus or Pro subscription.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "404":
          description: Journal entry not found for this user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
        "500":
          description: Internal server error.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ErrorResponse"
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: API Key
      description: >
        Bearer token. Either a per-user API key (`sk_...`, Pro-only) or the
        configured service token (`GPT_SERVICE_TOKEN`), which authenticates as a
        Plus-or-higher service account. Send as `Authorization: Bearer <token>`.
  schemas:
    CreateTarotReadingRequest:
      type: object
      required:
        - spreadInfo
        - cardsInfo
      additionalProperties: false
      properties:
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        cardsInfo:
          type: array
          description: Cards in the order they appear in the spread.
          minItems: 1
          items:
            $ref: "#/components/schemas/CardInfo"
        userQuestion:
          type: string
          description: Optional question or topic posed by the user.
        reflectionsText:
          type: string
          description: Optional reflection or additional context from the user.
        reversalFrameworkOverride:
          type: string
          description: Optional override for the reversal interpretation framework.
        deckStyle:
          type: string
          description: Optional deck style identifier.
          examples:
            - rws-1909
        personalization:
          $ref: "#/components/schemas/Personalization"
        location:
          $ref: "#/components/schemas/Location"
        persistLocationToJournal:
          type: boolean
          description: Whether to persist location data with the journal entry.
        includePromptDebug:
          type: boolean
          default: false
          description: >
            Diagnostic opt-in, owner-only. When true AND the request is
            authenticated with the owner token (GPT_OWNER_TOKEN, not the shared
            GPT_SERVICE_TOKEN) AND the backend has PROMPT_DEBUG_ENABLED set, the
            response includes a `promptDebug` object with the assembled
            system/user prompt. Ignored (silently) for every other caller,
            including ordinary service-account callers.
    DrawTarotReadingRequest:
      type: object
      required:
        - spreadInfo
      additionalProperties: false
      description: >
        Request to draw cards on the backend and generate a reading.
        Mirrors `CreateTarotReadingRequest` but omits `cardsInfo` because
        the server performs the draw. Include `spreadInfo.key` whenever
        possible so the backend can resolve position metadata.
      properties:
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        userQuestion:
          type: string
          description: Optional question or topic posed by the user.
        reflectionsText:
          type: string
          description: Optional reflection or additional context from the user.
        reversalFrameworkOverride:
          type: string
          description: Optional override for the reversal interpretation framework.
        deckStyle:
          type: string
          description: Optional deck style identifier.
          examples:
            - rws-1909
            - thoth-a1
            - marseille-classic
        allowReversals:
          type: boolean
          description: >
            Whether the backend may deal reversed cards. Defaults to true
            when omitted.
          default: true
        seed:
          type: string
          description: >
            Optional deterministic seed for the shuffle/draw. When provided,
            the backend reuses it so the same ritual inputs produce the
            same hand. Free-form string.
        personalization:
          $ref: "#/components/schemas/Personalization"
        location:
          $ref: "#/components/schemas/Location"
        persistLocationToJournal:
          type: boolean
          description: Whether to persist location data with the journal entry.
        includePromptDebug:
          type: boolean
          default: false
          description: >
            Diagnostic opt-in, owner-only. When true AND the request is
            authenticated with the owner token (GPT_OWNER_TOKEN, not the shared
            GPT_SERVICE_TOKEN) AND the backend has PROMPT_DEBUG_ENABLED set, the
            response includes a `promptDebug` object with the assembled
            system/user prompt. Ignored (silently) for every other caller,
            including ordinary service-account callers.
    DrawTarotReadingResponse:
      type: object
      required:
        - reading
        - provider
        - requestId
        - cardsInfo
      additionalProperties: true
      description: >
        Response returned by `drawTarotReading`. Extends the standard
        reading response with `cardsInfo` describing the cards the backend
        actually drew, plus an optional `seed` so the draw can be
        reproduced or journaled.
      properties:
        reading:
          type: string
          description: Generated tarot reading narrative.
        provider:
          type: string
          description: Reading backend or provider used.
          examples:
            - local-composer
            - openai-native
            - azure-gpt5
        requestId:
          type: string
          description: Unique request identifier.
        cardsInfo:
          type: array
          description: Cards the backend drew, in spread order.
          minItems: 1
          items:
            $ref: "#/components/schemas/CardInfo"
        spreadInfo:
          $ref: "#/components/schemas/SpreadInfo"
        seed:
          type: string
          description: Seed actually used for the draw, when available.
        themes:
          description: Overarching themes detected in the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        reasoning:
          description: Reasoning or model metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        context:
          description: Contextual inference applied to the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        visionInsights:
          type: array
          description: Vision-derived insights, if card images were used.
          items:
            type: object
            additionalProperties: true
        narrativeMetrics:
          description: Coverage or quality metrics for the generated narrative.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        graphRAG:
          description: Graph retrieval-augmented generation metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        promptDebug:
          $ref: "#/components/schemas/PromptDebug"
    SpreadInfo:
      type: object
      required:
        - name
      additionalProperties: false
      properties:
        name:
          type: string
          description: Display name of the tarot spread, as it appears in the app's spread registry.
          examples:
            - Three-Card Story (Past · Present · Future)
            - Celtic Cross (Classic 10-Card)
        key:
          type: string
          description: >
            Canonical spread identifier. One of `single`, `threeCard`, `fiveCard`, `decision`, `relationship`,
            `celtic`. Send it whenever possible so the backend can resolve position metadata, and so a reading that is
            later journaled groups correctly in history and pattern views.
          examples:
            - threeCard
            - celtic
    CardInfo:
      type: object
      required:
        - position
        - card
        - orientation
        - meaning
      additionalProperties: false
      properties:
        position:
          type: string
          description: Position of the card in the spread.
          examples:
            - Past
            - Present
            - Future
        card:
          type: string
          description: Name of the tarot card.
          examples:
            - The Fool
            - The Magician
            - Six of Swords
        orientation:
          type: string
          description: Orientation of the card. Prefer lowercase values.
          enum:
            - upright
            - reversed
            - Upright
            - Reversed
        meaning:
          type: string
          description: Meaning or interpretation of the card in this position.
        number:
          type: integer
          description: Optional card number if known.
        suit:
          type: string
          description: Optional suit for minor arcana cards.
          examples:
            - Cups
            - Pentacles
            - Swords
            - Wands
        rank:
          type: string
          description: Optional rank name for minor arcana cards.
          examples:
            - Ace
            - Two
            - Queen
        rankValue:
          type: integer
          description: Optional numeric rank value for minor arcana cards.
    Personalization:
      type: object
      description: Optional personalization settings for the reading narrative.
      additionalProperties: false
      properties:
        displayName:
          type: string
          description: User's preferred name.
        readingTone:
          type: string
          description: Preferred tone of the reading.
          enum:
            - gentle
            - balanced
            - blunt
        spiritualFrame:
          type: string
          description: Preferred interpretive frame.
          enum:
            - psychological
            - spiritual
            - mixed
            - playful
        tarotExperience:
          type: string
          description: User's experience level with tarot.
          enum:
            - newbie
            - intermediate
            - experienced
        preferredSpreadDepth:
          type: string
          description: Preferred depth of the reading.
          enum:
            - short
            - standard
            - deep
        focusAreas:
          type: array
          description: Specific life areas or themes to emphasize.
          items:
            type: string
          examples:
            - - career
              - relationships
              - decision-making
    Location:
      type: object
      description: Optional location context.
      additionalProperties: false
      properties:
        latitude:
          type: number
          minimum: -90
          maximum: 90
        longitude:
          type: number
          minimum: -180
          maximum: 180
        timezone:
          type: string
          description: IANA timezone name.
          examples:
            - America/Chicago
        accuracy:
          type: number
          description: Optional GPS accuracy in meters.
        source:
          type: string
          description: Source of the location data.
          enum:
            - browser
            - manual
    TarotReadingResponse:
      type: object
      required:
        - reading
        - provider
        - requestId
      additionalProperties: true
      properties:
        reading:
          type: string
          description: Generated tarot reading narrative.
        provider:
          type: string
          description: Reading backend or provider used.
          examples:
            - local-composer
            - openai-native
            - azure-gpt5
        requestId:
          type: string
          description: Unique request identifier.
        themes:
          description: Overarching themes detected in the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        reasoning:
          description: Reasoning or model metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        context:
          description: Contextual inference applied to the reading.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        visionInsights:
          type: array
          description: Vision-derived insights, if card images were used.
          items:
            type: object
            additionalProperties: true
        narrativeMetrics:
          description: Coverage or quality metrics for the generated narrative.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        graphRAG:
          description: Graph retrieval-augmented generation metadata.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        promptDebug:
          $ref: "#/components/schemas/PromptDebug"
    PromptDebug:
      type: object
      additionalProperties: true
      description: >
        Diagnostic echo of the exact prompt the backend assembled for the
        narrative model. Present only when the request set
        `includePromptDebug: true`, the caller authenticated with the owner
        token (`GPT_OWNER_TOKEN`), and the backend has `PROMPT_DEBUG_ENABLED`
        set. Absent for readings served by the local composer, which uses no
        model prompt. Prompt text is unredacted, and each prompt is truncated to
        20,000 characters so the response stays under the 100,000-character
        Actions ceiling.
      properties:
        templateVersion:
          type: string
          description: Reading prompt template version (READING_PROMPT_VERSION).
        provider:
          type: string
          description: Narrative backend that assembled the prompt.
          examples:
            - openai-native
            - azure-gpt5
        systemPrompt:
          type: string
          description: Verbatim system prompt sent to the narrative model.
        userPrompt:
          type: string
          description: Verbatim user prompt assembled from the cards and context.
        truncated:
          type: boolean
          description: >
            True when either prompt exceeded the 20,000-character budget and was
            cut short. The elided text is marked inline.
    ErrorResponse:
      type: object
      additionalProperties: true
      properties:
        error:
          type: string
          description: Error message.
        message:
          type: string
          description: Human-readable error message.
        code:
          type: string
          description: Machine-readable error code.
        requestId:
          type: string
          description: Request identifier for debugging.
        requiredTier:
          type: string
          description: Present on 403 responses from the journal tier gate.
    SaveReadingRequest:
      type: object
      description: >
        A completed reading, carried over from the reading exchange. Field names are the journal's, not the reading
        API's; each property names the reading-side field it comes from. `location`, `persistLocationConsent`,
        `timestampMs` and `followUps` are accepted by the endpoint but deliberately omitted here: they belong to the
        app's own save path, not to a conversational one.
      required:
        - spread
        - spreadKey
        - cards
      additionalProperties: false
      properties:
        spread:
          type: string
          description: Display name of the spread. From `spreadInfo.name`.
          examples:
            - Three-Card Story (Past · Present · Future)
            - Celtic Cross (Classic 10-Card)
        spreadKey:
          type: string
          description: >
            Canonical spread key from the app's spread registry. History, filters and pattern views group on this value,
            so a key outside this set silently fragments the user's history.
          enum:
            - single
            - threeCard
            - fiveCard
            - decision
            - relationship
            - celtic
        question:
          type: string
          description: The user's question or topic. From `userQuestion`.
        cards:
          type: array
          description: Cards in spread order, in the journal's card shape. From `cardsInfo`, remapped.
          minItems: 1
          items:
            $ref: "#/components/schemas/JournalCard"
        personalReading:
          type: string
          description: >
            The generated narrative, verbatim. From `reading`. Omitting it stores an entry with no narrative and skips
            the asynchronous coach-suggestion extraction, so always send it.
        themes:
          description: Overarching themes detected in the reading. From `themes`.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
        context:
          type: string
          description: >
            Reading taxonomy, not free text. Anything outside this set is stored as null. `relationship` is accepted as
            a legacy alias for `love`.
          enum:
            - love
            - career
            - self
            - spiritual
            - wellbeing
            - decision
            - general
        provider:
          type: string
          description: Narrative backend that produced the reading. From `provider`.
          examples:
            - local-composer
            - openai-native
            - azure-gpt5
        sessionSeed:
          type: string
          description: >
            Deterministic draw seed. From `seed`. This is the endpoint's only deduplication key: sending it twice
            returns the existing entry instead of creating a second one. Absent for unseeded draws and for all
            `createTarotReading` readings, which are therefore saved unconditionally.
        requestId:
          type: string
          description: Identifier of the originating reading request. From `requestId`. Stored for tracing only.
        deckId:
          type: string
          description: Deck style used. From `deckStyle`.
          examples:
            - rws-1909
            - thoth-a1
            - marseille-classic
        userPreferences:
          description: Personalization snapshot. From `personalization`.
          anyOf:
            - type: object
              additionalProperties: true
            - type: "null"
    JournalCard:
      type: object
      description: >
        One card as stored in the journal. This is NOT the reading API's `CardInfo`: the card name lives in `name`, and
        `meaning` is not stored. Archetype tracking reads `name` with no fallback, so a card sent as `card` is recorded
        with no name at all.
      required:
        - position
        - name
        - orientation
      additionalProperties: false
      properties:
        position:
          type: string
          description: Position of the card in the spread.
          examples:
            - Past
            - Present
            - Future
        name:
          type: string
          description: Name of the tarot card. From `CardInfo.card`.
          examples:
            - The Fool
            - Six of Swords
        orientation:
          type: string
          description: Capitalized in the journal, unlike the reading API's lowercase default.
          enum:
            - Upright
            - Reversed
        number:
          type: integer
          description: Major Arcana number (0-21), when known.
        suit:
          type: string
          description: Minor Arcana suit, when known.
          examples:
            - Cups
            - Pentacles
            - Swords
            - Wands
        rank:
          type: string
          description: Minor Arcana rank name, when known.
          examples:
            - Ace
            - Six
            - Queen
        rankValue:
          type: integer
          description: Minor Arcana numeric rank, when known.
    JournalEntryResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        deduplicated:
          type: boolean
          description: True when an entry with this `sessionSeed` already existed and was returned unchanged.
        entry:
          type: object
          additionalProperties: true
          properties:
            id:
              type: string
              description: Journal entry id. Retain this for `addReflectionToJournalEntry`.
            ts:
              type: integer
              description: Creation timestamp in milliseconds.
    AddReflectionRequest:
      type: object
      required:
        - text
        - scope
      additionalProperties: false
      description: >
        A single user-authored reflection. When `scope` is `card`, `card` is required and must match a card in the saved
        entry; `position` is required whenever that card appears more than once in the spread.
      properties:
        text:
          type: string
          minLength: 1
          maxLength: 2000
          description: The user's reflection, preserved in their own words.
        scope:
          type: string
          description: Whether the reflection is about the whole reading or a single card.
          enum:
            - reading
            - card
        card:
          type: string
          description: Exact card name from the saved entry. Required when `scope` is `card`.
          examples:
            - The Hermit
        position:
          type: string
          description: Exact spread position from the saved entry.
          examples:
            - Past
    ReflectionResponse:
      type: object
      additionalProperties: true
      properties:
        success:
          type: boolean
        entryId:
          type: string
        key:
          type: string
          description: Key the reflection was filed under; a card index for card scope, `Overall` for reading scope.
        reflections:
          type: object
          additionalProperties:
            type: string
          description: The full reflections map after the addition.
